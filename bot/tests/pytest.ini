[pytest]
# Настройки asyncio для устранения предупреждений
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function

# Пути к тестам
testpaths = bot/tests bot/tests/unit bot/tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Опции запуска
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
    --maxfail=5

# Маркеры тестов
markers =
    unit: Unit tests (fast, isolated, mocked dependencies)
    integration: Integration tests (slower, real dependencies)
    requires_edge: Requires deployed Edge Function (upload-text) and EDGE_USE_MOCK, EDGE_MOCK_TEST_SECRET
    e2e: End-to-end tests (full system, real infrastructure)
    slow: marks tests as slow (deselect with '-m "not slow"')
    auth: marks tests as authentication tests
    health: marks tests as health check tests
    error: marks tests as error handling tests
    performance: marks tests as performance tests
    full_floou_mock_wallet: Full floou test draft→sign_arweave→callback→sign_contract→submit (W7)
    full_floou_real_services: E2E с реальными bot (поток), arweave-uploader, wallet-mock (W7)

# Фильтры предупреждений
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::pytest.PytestDeprecationWarning
    ignore::pytest.PytestUnknownMarkWarning
