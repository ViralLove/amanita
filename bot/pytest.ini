[pytest]
# Настройки asyncio для устранения предупреждений
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Пути к тестам
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Опции запуска
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
    --maxfail=5

# Маркеры тестов
markers =
    unit: Unit тесты (не требуют внешних зависимостей)
    integration: Integration тесты (могут требовать переменные окружения)
    e2e: E2E тесты (требуют Hardhat node)
    requires_node: Требует запущенный Hardhat node
    requires_arweave: Требует доступность Arweave
    requires_env: Требует переменные окружения (список через запятую)
    slow: marks tests as slow (deselect with '-m "not slow"')
    auth: marks tests as authentication tests
    health: marks tests as health check tests
    error: marks tests as error handling tests
    performance: marks tests as performance tests

# Фильтры предупреждений
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
