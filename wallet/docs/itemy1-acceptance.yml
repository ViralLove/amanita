acceptance_criteria:
  - name: "no_recursion_errors"
    description: "Функции handleCreateWallet() и handleRestoreWallet() не должны вызывать 'Maximum call stack size exceeded'"
    test: "Вызвать функции и проверить отсутствие рекурсивных ошибок в консоли"
    priority: "high"
    quality_gates:
      - "NO_RECURSION: Функции не должны вызывать сами себя бесконечно"
      - "ASYNC_DOM: DOM операции должны быть асинхронными"
      - "ISOLATION: Логирование не должно влиять на основную логику"
  
  - name: "preserve_logging_functionality"
    description: "Функция logIfAvailable() должна продолжать работать для отладки"
    test: "Проверить, что логи отображаются в debug-panel"
    priority: "medium"
    quality_gates:
      - "LOG_VISIBILITY: Логи должны отображаться в UI"
      - "TIMESTAMP_FORMAT: Временные метки должны сохраняться"
      - "ERROR_STYLING: Ошибки должны выделяться цветом"
  
  - name: "performance_maintained"
    description: "Исправление не должно замедлять работу приложения"
    test: "Измерить время выполнения функций до и после исправления"
    priority: "low"
    quality_gates:
      - "NO_SLOWDOWN: Время выполнения не должно увеличиваться > 10%"
      - "MEMORY_STABLE: Потребление памяти должно оставаться стабильным"
