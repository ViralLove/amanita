acceptance_criteria:
  - name: "css_hidden_priority"
    description: "CSS правило .hidden должно иметь приоритет над inline стилями"
    test: "Проверить, что элемент с классом hidden имеет display: none даже при inline style"
    priority: "high"
    quality_gates:
      - "CSS_OVERRIDES_INLINE: CSS правило .hidden переопределяет inline стили"
      - "IMPORTANT_WORKS: !important работает корректно"
      - "CONSISTENT_BEHAVIOR: Поведение предсказуемо для всех элементов"
  
  - name: "selector_accuracy"
    description: "Селектор .view:not(.hidden) должен находить правильный видимый экран"
    test: "Проверить, что селектор находит экран с display: block и без класса hidden"
    priority: "high"
    quality_gates:
      - "CORRECT_SELECTION: Селектор находит правильный элемент"
      - "NO_FALSE_POSITIVES: Не находит скрытые элементы"
      - "DYNAMIC_UPDATES: Работает при динамических изменениях"
  
  - name: "switchview_sync"
    description: "Функция switchView() должна синхронизировать CSS классы и inline стили"
    test: "Проверить, что switchView() корректно управляет и классами, и стилями"
    priority: "high"
    quality_gates:
      - "CLASS_SYNC: Классы hidden добавляются/удаляются корректно"
      - "STYLE_SYNC: Inline стили синхронизированы с классами"
      - "NO_CONFLICTS: Нет конфликтов между классами и стилями"
  
  - name: "all_screens_consistent"
    description: "Все экраны должны иметь согласованное поведение"
    test: "Проверить поведение всех экранов при переключении"
    priority: "medium"
    quality_gates:
      - "UNIFORM_BEHAVIOR: Все экраны ведут себя одинаково"
      - "PREDICTABLE_STATE: Состояние экранов предсказуемо"
      - "NO_EDGE_CASES: Нет особых случаев или исключений"
  
  - name: "performance_optimized"
    description: "Логика определения видимого экрана должна быть оптимизирована"
    test: "Проверить производительность селектора и переключения экранов"
    priority: "low"
    quality_gates:
      - "FAST_SELECTION: Селектор работает быстро"
      - "EFFICIENT_SWITCHING: Переключение экранов эффективно"
      - "NO_MEMORY_LEAKS: Нет утечек памяти"
