acceptance_criteria:
  - name: "css_hidden_rule"
    description: "CSS правило для класса .hidden должно быть добавлено"
    test: "Проверить наличие .hidden { display: none !important; } в styles.css"
    priority: "high"
    quality_gates:
      - "CSS_RULE_EXISTS: Правило .hidden определено в CSS"
      - "IMPORTANT_FLAG: Использован !important для приоритета"
      - "DISPLAY_NONE: Устанавливает display: none"
  
  - name: "switchview_consistency"
    description: "Функция switchView() должна работать согласованно с CSS классами"
    test: "Проверить, что switchView() управляет классами hidden, а не только inline стилями"
    priority: "high"
    quality_gates:
      - "CLASS_MANAGEMENT: Управляет CSS классами hidden"
      - "INLINE_SYNC: Синхронизирует inline стили с классами"
      - "NO_CONFLICTS: Нет конфликтов между CSS и inline стилями"
  
  - name: "duplicate_removal"
    description: "Дублирование seed-screen в массиве all должно быть удалено"
    test: "Проверить, что в массиве all нет дублирующихся элементов"
    priority: "medium"
    quality_gates:
      - "NO_DUPLICATES: Массив all содержит уникальные элементы"
      - "ALL_SCREENS: Все экраны присутствуют в массиве"
      - "CORRECT_ORDER: Порядок элементов логичен"
  
  - name: "screen_switching_works"
    description: "Переключение между всеми экранами должно работать корректно"
    test: "Протестировать переключение на каждый экран через switchView()"
    priority: "high"
    quality_gates:
      - "ALL_SCREENS_SWITCHABLE: Все экраны переключаются"
      - "CORRECT_DISPLAY: Показывается правильный экран"
      - "OTHERS_HIDDEN: Остальные экраны скрыты"
      - "NO_STUCK_SCREENS: Нет застрявших экранов"
  
  - name: "html_css_consistency"
    description: "HTML классы должны быть согласованы с CSS"
    test: "Проверить, что все экраны имеют одинаковую структуру классов"
    priority: "medium"
    quality_gates:
      - "UNIFORM_CLASSES: Все экраны имеют классы view и hidden"
      - "SUCCESS_SCREEN_FIX: success-screen имеет класс hidden"
      - "CONSISTENT_STRUCTURE: Единообразная структура HTML"
