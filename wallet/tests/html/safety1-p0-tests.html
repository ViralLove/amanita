        }

        .test-status.running { background: #fff3cd; color: #856404; }
        .test-status.passed { background: #d4edda; color: #155724; }

            font-size: 12px;

        }

            background: #e9ecef;

        }
        .test-log {
            background: #f8f9fa;
            border-radius: 5px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 100px;
            overflow-y: auto;

        .test-actions {

            gap: 10px;

        let testResults = {};
        let testLogs = {};
        let isRunning = false;

        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            console.log(`STATUS: ${message}`);
        }

        function createTestCard(test) {
            return `
                <div class="test-card" id="card-${test.id}">
                    <div class="test-title">
                        <h3>${test.title}</h3>
                        <span class="test-status pending" id="status-${test.id}">Ожидание</span>
                    </div>
                    <div class="test-description">${test.description}</div>
                    <div class="test-function-name">
                        <strong>Функция:</strong> <code>${test.name}()</code>
                    </div>
                    <div class="test-log" id="log-${test.id}">Ожидание выполнения...</div>
                    <div class="test-actions" id="actions-${test.id}" style="display: none;">
                        <button class="btn btn-info" onclick="downloadTestLog('${test.id}')">📄 Скачать лог</button>
                        <button class="btn btn-info" onclick="showDetailedLog('${test.id}')">🔍 Детальный лог</button>
                        <button class="btn btn-info" onclick="copyTestLog('${test.id}')">📋 Копировать лог</button>
                    </div>
                    <div class="test-run-single" id="run-single-${test.id}">
                        <button class="btn btn-success" onclick="runSingleTest('${test.id}')">▶️ Запустить тест</button>
                    </div>
                </div>
            `;
        }

        function updateTestStatus(testId, status, message = '') {
            const card = document.getElementById(`card-${testId}`);
            const statusEl = document.getElementById(`status-${testId}`);
            const logEl = document.getElementById(`log-${testId}`);
            const actionsEl = document.getElementById(`actions-${testId}`);
            
            if (statusEl) statusEl.textContent = status;
            if (statusEl) statusEl.className = `test-status ${status}`;
            if (card) card.className = `test-card ${status}`;
            
            if (message && logEl) {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = `[${timestamp}] ${message}`;
                logEl.innerHTML += `<div>${logEntry}</div>`;
                logEl.scrollTop = logEl.scrollHeight;
                
                if (!testLogs[testId]) testLogs[testId] = [];
                testLogs[testId].push(logEntry);
            }
            
            if ((status === 'passed' || status === 'failed') && actionsEl) {
                actionsEl.style.display = 'flex';
            }
        }

        function updateProgress() {
            const completed = Object.keys(testResults).length;
            const passed = Object.values(testResults).filter(r => r === true).length;
            const failed = Object.values(testResults).filter(r => r === false).length;
            
            const progress = (completed / allTests.length) * 100;
            const progressFill = document.getElementById('progressFill');
            if (progressFill) progressFill.style.width = `${progress}%`;
            
            const summaryText = document.getElementById('summaryText');
            if (summaryText) {
                if (completed === 0) {
                    summaryText.textContent = 'Ожидание запуска тестов...';
                } else if (completed < allTests.length) {
                    summaryText.textContent = `Выполнено: ${completed}/${allTests.length} | Пройдено: ${passed} | Провалено: ${failed}`;
                } else {
                    summaryText.innerHTML = `
                        <strong>Завершено: ${completed}/${allTests.length}</strong><br>
                        ✅ Пройдено: ${passed}<br>
                        ❌ Провалено: ${failed}<br>
                        📈 Успешность: ${((passed/allTests.length)*100).toFixed(1)}%
                    `;
                }
            }
        }

        function initializeTests() {
            console.log('=== НАЧАЛО initializeTests ===');
            
            const grid = document.getElementById('testsGrid');
            if (!grid) {
                console.error('❌ Элемент testsGrid не найден!');
                return;
            }
            
            console.log('✅ testsGrid найден, очищаем...');
            grid.innerHTML = '';
            
            console.log('Создаем карточки для', allTests.length, 'тестов');
            
            allTests.forEach((test, index) => {
                console.log(`--- Создаем карточку ${index + 1}/${allTests.length} ---`);
                const cardHtml = createTestCard(test);
                grid.innerHTML += cardHtml;
                console.log(`✅ Карточка ${test.title} добавлена в grid`);
            });
            
            console.log('=== КОНЕЦ initializeTests ===');
            console.log('grid.innerHTML длина:', grid.innerHTML.length);
            console.log('Количество элементов в grid:', grid.children.length);
        }

        async function runAllTests() {
            if (isRunning) return;
            isRunning = true;
            updateStatus('Запуск всех тестов...', 'running');
            
            // Перехватываем console.log для всех тестов
            const originalConsoleLog = console.log;
            const originalConsoleError = console.error;
            
            console.log = function(...args) {
                originalConsoleLog.apply(console, args);
                const message = args.join(' ');
                // Ищем тест по префиксу в сообщении
                const testMatch = message.match(/\[(test_\w+)\]/);
                if (testMatch) {
                    const testName = testMatch[1];
                    const test = allTests.find(t => t.name === testName);
                    if (test) {
                        updateTestStatus(test.id, 'running', message);
                    }
                } else if (message.includes('🧪') || 
                          message.includes('🔍') || 
                          message.includes('✅') || 
                          message.includes('❌') ||
                          message.includes('Тест') ||
                          message.includes('Ошибка') ||
                          message.includes('Проверка')) {
                    // Если нет префикса, но есть ключевые слова, показываем в текущем тесте
                    const currentTest = allTests.find(t => testResults[t.id] === undefined);
                    if (currentTest) {
                        updateTestStatus(currentTest.id, 'running', message);
                    }
                }
            };
            
            console.error = function(...args) {
                originalConsoleError.apply(console, args);
                const message = args.join(' ');
                // Ищем тест по префиксу в сообщении
                const testMatch = message.match(/\[(test_\w+)\]/);
                if (testMatch) {
                    const testName = testMatch[1];
                    const test = allTests.find(t => t.name === testName);
                    if (test) {
                        updateTestStatus(test.id, 'running', message);
                    }
                } else if (message.includes('🧪') || 
                          message.includes('🔍') || 
                          message.includes('✅') || 
                          message.includes('❌') ||
                          message.includes('Тест') ||
                          message.includes('Ошибка') ||
                          message.includes('Проверка')) {
                    // Если нет префикса, но есть ключевые слова, показываем в текущем тесте
                    const currentTest = allTests.find(t => testResults[t.id] === undefined);
                    if (currentTest) {
                        updateTestStatus(currentTest.id, 'running', message);
                    }
                }
            };
            
            try {
                for (const test of allTests) {
                    try {
                        updateTestStatus(test.id, 'running', 'Выполняется...');
                        
                        if (typeof window[test.name] === 'function') {
                            const result = await window[test.name]();
                            testResults[test.id] = result;
                            updateTestStatus(test.id, result ? 'passed' : 'failed', 
                                result ? 'Тест пройден' : 'Тест провален');
                        } else {
                            testResults[test.id] = false;
                            updateTestStatus(test.id, 'failed', 'Функция теста не найдена');
                        }
                    } catch (error) {
                        testResults[test.id] = false;
                        updateTestStatus(test.id, 'failed', `Ошибка: ${error.message}`);
                    }
                    
                    updateProgress();
                    await new Promise(resolve => setTimeout(resolve, 100));
                }
            } finally {
                // Восстанавливаем оригинальные функции
                console.log = originalConsoleLog;
                console.error = originalConsoleError;
            }
            
            isRunning = false;
            updateStatus('Все тесты завершены', 'success');
        }

        async function runIndividualTests() {
            if (isRunning) return;
            isRunning = true;
            updateStatus('Запуск тестов по одному...', 'running');
            
            for (const test of allTests) {
                try {
                    updateTestStatus(test.id, 'running', 'Выполняется...');
                    
                    if (typeof window[test.name] === 'function') {
                        const result = await window[test.name]();
                        testResults[test.id] = result;
                        updateTestStatus(test.id, result ? 'passed' : 'failed', 
                            result ? 'Тест пройден' : 'Тест провален');
                    } else {
                        testResults[test.id] = false;
                        updateTestStatus(test.id, 'failed', 'Функция теста не найдена');
                    }
                } catch (error) {
                    testResults[test.id] = false;
                    updateTestStatus(test.id, 'failed', `Ошибка: ${error.message}`);
                    // Обновляем статус карточки
                    const card = document.getElementById(`test-${test.id}`);
                    if (card) {
                        const statusTag = card.querySelector('.test-status');
                        if (statusTag) {
                            statusTag.textContent = 'ПРОВАЛЕН';
                            statusTag.className = 'test-status failed';
                        }
                    }
                }
                
                updateProgress();
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            
            isRunning = false;
            updateStatus('Все тесты завершены', 'success');
        }

        async function runSingleTest(testId) {
            if (isRunning) return;
            
            const test = allTests.find(t => t.id === testId);
            if (!test) {
                console.error(`Тест с ID ${testId} не найден`);
                return;
            }
            
            isRunning = true;
            updateStatus(`Запуск теста: ${test.title}`, 'running');
            
            // Очищаем предыдущие логи
            testLogs[testId] = [];
            
            // Перехватываем console.log для этого теста
            const originalConsoleLog = console.log;
            const originalConsoleError = console.error;
            
            console.log = function(...args) {
                originalConsoleLog.apply(console, args);
                const message = args.join(' ');
                // Перехватываем все логи во время выполнения теста
                if (message.includes(`[${test.name}]`) || 
                    message.includes('🧪') || 
                    message.includes('🔍') || 
                    message.includes('✅') || 
                    message.includes('❌') ||
                    message.includes('Тест') ||
                    message.includes('Ошибка') ||
                    message.includes('Проверка')) {
                    updateTestStatus(test.id, 'running', message);
                }
            };
            
            console.error = function(...args) {
                originalConsoleError.apply(console, args);
                const message = args.join(' ');
                // Перехватываем все ошибки во время выполнения теста
                if (message.includes(`[${test.name}]`) || 
                    message.includes('🧪') || 
                    message.includes('🔍') || 
                    message.includes('✅') || 
                    message.includes('❌') ||
                    message.includes('Тест') ||
                    message.includes('Ошибка') ||
                    message.includes('Проверка')) {
                    updateTestStatus(test.id, 'running', message);
                }
            };
            
            try {
                updateTestStatus(test.id, 'running', 'Выполняется...');
                
                if (typeof window[test.name] === 'function') {
                    console.log(`🚀 Запуск теста ${test.name}()...`);
                    updateTestStatus(test.id, 'running', `[${test.name}] Запуск функции...`);
                    
                    const result = await window[test.name]();
                    testResults[test.id] = result;
                    
                    if (result) {
                        updateTestStatus(test.id, 'passed', 'Тест пройден успешно');
                        console.log(`✅ Тест ${test.name}() завершен: ПРОЙДЕН`);
                    } else {
                        updateTestStatus(test.id, 'failed', 'Тест провален');
                        console.log(`❌ Тест ${test.name}() завершен: ПРОВАЛЕН`);
                    }
                } else {
                    testResults[test.id] = false;
                    updateTestStatus(test.id, 'failed', `Функция ${test.name} не найдена`);
                    console.error(`❌ Функция ${test.name} не найдена`);
                    console.error(`🔍 Доступные функции test_*:`, Object.keys(window).filter(k => k.startsWith('test_')));
                    console.error(`🔍 Все функции в window:`, Object.keys(window).filter(k => typeof window[k] === 'function').slice(0, 10));
                }
            } catch (error) {
                testResults[test.id] = false;
                updateTestStatus(test.id, 'failed', `Ошибка: ${error.message}`);
                console.error(`❌ Ошибка в тесте ${test.name}:`, error);
            } finally {
                // Восстанавливаем оригинальные функции
                console.log = originalConsoleLog;
                console.error = originalConsoleError;
            }
            
            updateProgress();
            isRunning = false;
            updateStatus(`Тест ${test.title} завершен`, 'info');
        }

        function clearResults() {
            testResults = {};
            testLogs = {};
            updateProgress();
            
            allTests.forEach(test => {
                updateTestStatus(test.id, 'pending', 'Ожидание выполнения...');
                const logEl = document.getElementById(`log-${test.id}`);
                if (logEl) logEl.innerHTML = 'Ожидание выполнения...';
                const actionsEl = document.getElementById(`actions-${test.id}`);
                if (actionsEl) actionsEl.style.display = 'none';
            });
            
            updateStatus('Результаты очищены', 'info');
        }

        function exportResults() {
            const timestamp = new Date().toISOString().slice(0,19);
            const passed = Object.values(testResults).filter(r => r === true).length;
            const total = allTests.length;
            
            let content = `# Safety1 P0 + P1 + P2 тесты - Отчет о тестировании\n`;
            content += `Дата: ${new Date().toLocaleString()}\n`;
            content += `Всего тестов: ${total}\n`;
            content += `Пройдено: ${passed}\n`;
            content += `Провалено: ${total - passed}\n`;
            content += `Успешность: ${((passed/total)*100).toFixed(1)}%\n\n`;
            
            content += `## Детальные результаты:\n\n`;
            
            allTests.forEach(test => {
                const result = testResults[test.id];
                const status = result === true ? '✅ ПРОЙДЕН' : result === false ? '❌ ПРОВАЛЕН' : '⏳ НЕ ВЫПОЛНЕН';
                content += `### ${test.title}\n`;
                content += `- **Статус:** ${status}\n`;
                content += `- **Описание:** ${test.description}\n`;
                content += `- **Категория:** ${test.category}\n\n`;
            });
            
            const blob = new Blob([content], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `safety1-p0-p1-p2-test-report-${timestamp}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function downloadTestLog(testId) {
            const test = allTests.find(t => t.id === testId);
            const logs = testLogs[testId] || [];
            const result = testResults[testId];
            
            let logContent = `# Детальный лог теста: ${test.title}\n`;
            logContent += `Дата: ${new Date().toLocaleString()}\n`;
            logContent += `Статус: ${result ? '✅ ПРОЙДЕН' : '❌ ПРОВАЛЕН'}\n`;
            logContent += `Описание: ${test.description}\n`;
            logContent += `Категория: ${test.category}\n\n`;
            logContent += `## Логи выполнения:\n\n`;
            
            logs.forEach(logEntry => {
                logContent += `${logEntry}\n`;
            });
            
            const blob = new Blob([logContent], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `test-log-${testId}-${new Date().toISOString().slice(0,19)}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function showDetailedLog(testId) {
            const test = allTests.find(t => t.id === testId);
            const logs = testLogs[testId] || [];
            const result = testResults[testId];
            
            let logContent = `Детальный лог теста: ${test.title}\n`;
            logContent += `Дата: ${new Date().toLocaleString()}\n`;
            logContent += `Статус: ${result ? '✅ ПРОЙДЕН' : '❌ ПРОВАЛЕН'}\n\n`;
            logContent += `Логи выполнения:\n`;
            logContent += `${'='.repeat(50)}\n`;
            
            logs.forEach(logEntry => {
                logContent += `${logEntry}\n`;
            });
            
            alert(logContent);
        }

        async function copyTestLog(testId) {
            const test = allTests.find(t => t.id === testId);
            const logs = testLogs[testId] || [];
            const result = testResults[testId];
            
            let logContent = `# Детальный лог теста: ${test.title}\n`;
            logContent += `Дата: ${new Date().toLocaleString()}\n`;
            logContent += `Статус: ${result ? '✅ ПРОЙДЕН' : '❌ ПРОВАЛЕН'}\n`;
            logContent += `Описание: ${test.description}\n`;
            logContent += `Категория: ${test.category}\n\n`;
            logContent += `## Логи выполнения:\n\n`;
            
            logs.forEach(logEntry => {
                logContent += `${logEntry}\n`;
            });
            
            try {
                await navigator.clipboard.writeText(logContent);
                console.log('✅ Лог скопирован в буфер обмена');
                
                // Показываем уведомление
                const status = document.getElementById('status');
                const originalText = status.textContent;
                const originalClass = status.className;
                
                status.textContent = '✅ Лог скопирован в буфер обмена';
                status.className = 'status success';
                
                setTimeout(() => {
                    status.textContent = originalText;
                    status.className = originalClass;
                }, 2000);
                
            } catch (error) {
                console.error('❌ Ошибка копирования в буфер обмена:', error);
                
                // Fallback - показываем в alert
                alert('Не удалось скопировать в буфер обмена. Лог:\n\n' + logContent);
            }
        }

        // Автоматический запуск при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            console.log('=== DOMContentLoaded СРАБОТАЛ ===');
            
            setTimeout(() => {
                initializeTests();
                updateProgress();
            }, 1000);
        });

        // Перехватываем ошибки
        window.addEventListener('error', function(event) {
            console.error(`❌ ОШИБКА: ${event.message}`);
        });
    </script>
</body>
</html>
